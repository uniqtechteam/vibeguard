[workspace]
resolver = "3"
members = ["crates/vibeguard", "crates/vibeguard-core"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uniqtechteam/vibeguard"
homepage = "https://github.com/uniqtechteam/vibeguard"
authors = ["UniqTech <https://uniqtech.dev>"]
keywords = ["security", "audit", "supabase", "nextjs", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
vibeguard-core = { path = "crates/vibeguard-core", version = "0.1.0-dev" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
tempfile = "3"
regex = "1"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
